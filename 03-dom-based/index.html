<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM-Based (Client-Side)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 flex flex-col items-center justify-center gap-6 p-6">
  <div class="text-center space-y-2">
    <p class="text-gray-400 text-sm uppercase tracking-widest">DOM-Based XSS Demo</p>
    <h1 class="text-3xl font-bold text-white">Page Router</h1>
    <p class="text-gray-500 text-xs">The payload lives in the URL hash — it never reaches the server.</p>
  </div>

  <div class="w-full max-w-sm flex flex-col gap-3">
    <!-- Current section display — sink -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl px-6 py-4 text-center">
      <p class="text-gray-500 text-xs uppercase tracking-widest mb-1">Current section</p>
      <p id="section-display" class="text-white text-lg font-semibold">Home</p>
    </div>

    <!-- Input updates the hash, simulating a client-side router -->
    <input
      id="section-input"
      type="text"
      placeholder="Type a section name"
      class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-4 py-2 placeholder-gray-500 focus:outline-none focus:border-red-500"
    />
    <p class="text-gray-500 text-xs">Try this payload: <code class="text-red-400">&lt;img src=x onerror="alert('Fatality ☠️')"&gt;</code></p>
  </div>

  <script>
    const display = document.getElementById('section-display');
    const input = document.getElementById('section-input');

    function renderFromHash() {
      const hash = decodeURIComponent(location.hash.slice(1)) || 'Home';
      // Intentionally vulnerable: hash value is written directly to the DOM without sanitization
      display.innerHTML = hash;
    }

    input.addEventListener('input', () => {
      // Update the URL hash — payload never leaves the browser
      location.hash = encodeURIComponent(input.value);
    });

    window.addEventListener('hashchange', renderFromHash);
    renderFromHash();
  </script>
</body>

</html>
