<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflected (Non-persistent)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 flex flex-col items-center justify-center gap-6 p-6">
  <div class="text-center space-y-4">
    <p class="text-gray-400 text-sm uppercase tracking-widest">Reflected XSS Demo</p>
    <h1 id="output" class="text-5xl font-bold text-white">Hello, <span id="name-display">World</span>!</h1>
  </div>

  <div class="flex flex-col items-center gap-2 w-full max-w-sm">
    <input
      id="name-input"
      type="text"
      placeholder="Type a text"
      class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-4 py-2 placeholder-gray-500 focus:outline-none focus:border-red-500"
    />
    <p class="text-gray-500 text-xs self-start">Try this payload: <code class="text-red-400">&lt;img src=x onerror=alert('Fatality ☠️')&gt;</code></p>
  </div>

  <script>
    const input = document.getElementById('name-input');
    const display = document.getElementById('name-display');
    input.addEventListener('input', () => {
      // Intentionally vulnerable: innerHTML reflects raw input to demo XSS
      display.innerHTML = input.value || 'World';
    });
  </script>
</body>

</html>
