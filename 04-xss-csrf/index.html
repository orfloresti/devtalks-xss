<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSS + CSRF — Victim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 flex flex-col items-center justify-center gap-6 p-6">

  <div class="text-center">
    <p class="text-gray-400 text-sm uppercase tracking-widest">Victim's browser</p>
    <h1 class="text-3xl font-bold text-white mt-1">My Account</h1>
    <p class="text-gray-500 text-xs mt-1">The victim opens this page normally. The XSS fires on load.</p>
  </div>

  <div class="w-full max-w-xl flex flex-col gap-4">

    <!-- Victim profile -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col gap-3">
      <p class="text-gray-400 text-xs uppercase tracking-widest">Profile</p>
      <div class="flex justify-between items-center">
        <div class="flex flex-col gap-1">
          <p class="text-gray-500 text-xs">Username</p>
          <p id="profile-username" class="text-white text-sm font-semibold">—</p>
        </div>
        <div class="flex flex-col gap-1 text-right">
          <p class="text-gray-500 text-xs">Email</p>
          <p id="profile-email" class="text-sm font-semibold text-white">—</p>
        </div>
      </div>
      <p id="profile-status" class="text-xs text-gray-600">Loading...</p>
    </div>

    <!-- Public comments — XSS sink -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col gap-3">
      <p class="text-gray-400 text-xs uppercase tracking-widest">Public comments</p>
      <div id="comments" class="flex flex-col gap-2 min-h-12">
        <p class="text-gray-600 text-xs text-center">No comments yet.</p>
      </div>
    </div>

  </div>

  <script>
    const originalEmail = 'victim@company.com';

    async function loadProfile() {
      const res = await fetch('/api/profile');
      const profile = await res.json();
      document.getElementById('profile-username').textContent = profile.username;

      const emailEl = document.getElementById('profile-email');
      const statusEl = document.getElementById('profile-status');
      emailEl.textContent = profile.email;

      if (profile.email !== originalEmail) {
        emailEl.classList.replace('text-white', 'text-red-400');
        statusEl.textContent = '⚠️ Email was silently changed by the XSS payload!';
        statusEl.classList.replace('text-gray-600', 'text-red-400');
      } else {
        emailEl.classList.replace('text-red-400', 'text-white');
        statusEl.textContent = 'Profile loaded.';
        statusEl.className = 'text-xs text-gray-600';
      }
    }

    async function loadComments() {
      const res = await fetch('/api/comments');
      const comments = await res.json();
      const container = document.getElementById('comments');
      container.innerHTML = comments.length === 0
        ? '<p class="text-gray-600 text-xs text-center">No comments yet.</p>'
        : '';
      comments.forEach(({ content }) => {
        const el = document.createElement('div');
        el.className = 'bg-gray-950 rounded-lg px-3 py-2';
        // Intentionally vulnerable: innerHTML executes stored XSS payloads
        el.innerHTML = `<span class="text-gray-300 text-xs">${content}</span>`;
        container.appendChild(el);
      });
      // Reload profile after comments render so XSS fetch has time to complete
      setTimeout(loadProfile, 400);
    }

    loadProfile();
    loadComments();
  </script>

</body>

</html>
